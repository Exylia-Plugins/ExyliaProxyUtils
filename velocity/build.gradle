dependencies {
    implementation project(':common')
    compileOnly 'com.velocitypowered:velocity-api:3.4.0'
    compileOnly('me.confuser.banmanager:BanManagerCommon:7.10.0') { transitive = false }
    compileOnly('me.confuser.banmanager:BanManagerVelocity:7.10.0') { transitive = false }
    // Writes velocity-plugin.json from the @Plugin annotation.
    annotationProcessor 'com.velocitypowered:velocity-api:3.4.0'
}

// @Plugin wants a compile-time constant for the version, and the version
// lives in build.gradle; this is the one place both meet.
def constantsDir = layout.buildDirectory.dir('generated/sources/constants/java/main')
def generateConstants = tasks.register('generateBuildConstants') {
    inputs.property('version', project.version)
    outputs.dir(constantsDir)
    doLast {
        def file = constantsDir.get().file('net/exylia/proxyutils/velocity/BuildConstants.java').asFile
        file.parentFile.mkdirs()
        file.text = """package net.exylia.proxyutils.velocity;

/** Generated by Gradle; the version is the one in build.gradle. */
final class BuildConstants {
    static final String VERSION = "${project.version}";

    private BuildConstants() {
    }
}
"""
    }
}
sourceSets.main.java.srcDir(generateConstants.map { constantsDir })
