// One jar for both proxies. Velocity reads velocity-plugin.json and ignores
// bungee.yml; BungeeCord does the reverse; each main class is only ever loaded
// by the proxy it was written for. The owner drops the same file in either.
plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.9'
}

def outputDirectory = '/root/Java/jars'

allprojects {
    group = 'net.exylia'
    version = '2.0.1'

    repositories {
        mavenCentral()
        maven {
            name = 'papermc-repo'
            url = 'https://repo.papermc.io/repository/maven-public/'
        }
        // LiteBans API and AdvancedBan.
        maven { url = 'https://jitpack.io' }
        // LibertyBans and its event bus, Omnibus.
        maven { url = 'https://mvn-repo.arim.space/affero-gpl3/' }
        maven { url = 'https://mvn-repo.arim.space/lesser-gpl3/' }
    }
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release.set(21)
    }

    dependencies {
        compileOnly 'org.jetbrains:annotations:26.0.2'
        testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
    }
}

dependencies {
    implementation project(':velocity')
    implementation project(':bungee')
}

shadowJar {
    archiveBaseName.set('ExyliaProxyUtils')
    archiveClassifier.set('')
    destinationDirectory = file("${outputDirectory}/plugins")
    // Jedis and everything it drags in live under our own package, so a proxy
    // that already has a Gson or an slf4j of its own never meets ours.
    relocate 'redis.clients', 'net.exylia.proxyutils.libs.redis'
    relocate 'org.apache.commons.pool2', 'net.exylia.proxyutils.libs.pool2'
    // slf4j stays where it is: Velocity injects org.slf4j.Logger into the main
    // class, and a relocated one is a type Guice has no binding for. Velocity's
    // own copy wins there (parent-first); Bungee has none and uses ours.
    relocate 'org.json', 'net.exylia.proxyutils.libs.json'
    relocate 'com.google.gson', 'net.exylia.proxyutils.libs.gson'
    exclude 'META-INF/maven/**'
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

tasks.named('build') { dependsOn shadowJar }

tasks.register('buildAll') {
    group = 'build'
    description = 'Cleans, tests and builds the universal proxy jar'
    dependsOn clean, subprojects.collect { it.tasks.named('test') }, shadowJar
}
subprojects.each { it.tasks.matching { t -> t.name == 'test' || t.name == 'compileJava' }.configureEach { mustRunAfter rootProject.tasks.named('clean') } }
shadowJar.mustRunAfter clean
