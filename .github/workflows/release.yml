name: Release

# Every push to main whose build.gradle version has no release yet publishes one.
# A push that keeps the version builds nothing: bump it to ship.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -nE "s/^[[:space:]]*version[[:space:]]*=[[:space:]]*'([0-9]+\.[0-9]+\.[0-9]+)'.*/\1/p" build.gradle)"
          [[ -n "$version" ]] || { echo "No X.Y.Z version in build.gradle." >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.version.outputs.needed == 'true'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.needed == 'true'

      - name: Build and test
        if: steps.version.outputs.needed == 'true'
        run: ./gradlew buildAll -PjarsDir=build/release

      - name: Publish the release
        if: steps.version.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          jar="build/release/plugins/ExyliaProxyUtils-${VERSION}.jar"
          # The fixed name is what the proxies' updater follows: releases/latest/download/ExyliaProxyUtils.jar.
          cp "$jar" build/release/plugins/ExyliaProxyUtils.jar
          gh release create "v${VERSION}" "$jar" build/release/plugins/ExyliaProxyUtils.jar \
            --target "$GITHUB_SHA" --title "ExyliaProxyUtils ${VERSION}" --generate-notes
